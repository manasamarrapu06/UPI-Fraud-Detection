<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SecurePay AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin-bottom: 0;
        }

        .login-container {
            width: 400px;
            max-width: 85%;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #162d6b;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .admin-link {
            display: block;
            margin-top: 15px;
            text-align: center;
        }

        .admin-link a {
            color: #1e3a8a;
            font-weight: bold;
        }
    </style>

    <!-- COMMON UPI FRAUD DETECTION THEME -->

</head>

<body>

    <div class="header">
        <h1>SecurePay AI</h1>
        <p>UPI Fraud Detection System</p>
    </div>

    <div class="login-container">

        <h2>Login</h2>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message"></div>

        <div class="links">
            New user?
            <a href="register.html">
                Create Account
            </a>
        </div>

        <div class="admin-link">
            <a href="#" onclick="showAdminLogin()">
                Admin Login
            </a>
        </div>

    </div>


    <!-- LOGIN JAVASCRIPT -->
    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let email =
                    document.getElementById("email").value;

                let password =
                    document.getElementById("password").value;


                console.log("Login button clicked");
                console.log("Email:", email);


                fetch("/api/auth/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                })

                .then(response => {

                    console.log(
                        "Server response:",
                        response.status
                    );

                    if (!response.ok) {
                        throw new Error(
                            "Invalid email or password"
                        );
                    }

                    return response.json();

                })

                .then(user => {

                    console.log(
                        "LOGIN USER:",
                        user
                    );

                    console.log(
                        "USER ROLE:",
                        user.role
                    );


                    // Store login information
                    sessionStorage.setItem(
                        "userRole",
                        user.role
                    );

                    sessionStorage.setItem(
                        "userEmail",
                        user.email
                    );


                    // Redirect according to role
                    if (user.role === "ADMIN") {

                        console.log(
                            "Admin detected. Opening admin dashboard."
                        );

                        window.location.href =
                            "admin-dashboard.html";

                    } else {

                        console.log(
                            "User detected. Opening user dashboard."
                        );

                        window.location.href =
                            "user-dashboard.html";
                    }

                })

                .catch(error => {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );

                    document.getElementById(
                        "message"
                    ).innerText =
                        "Invalid email or password.";

                });

            });


        // Admin login message
        function showAdminLogin() {

            document.getElementById(
                "message"
            ).innerText =
                "Admin login uses the same login form. Enter an administrator account.";

        }

    </script>

</body>

</html>
