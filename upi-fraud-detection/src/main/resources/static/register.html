<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SecurePay AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .register-container {
            width: 450px;
            max-width: 85%;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #162d6b;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>SecurePay AI</h1>
    <p>Create your account</p>
</div>

<div class="register-container">

    <h2>Register</h2>

    <form id="registerForm">

        <label>Full Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
        >

        <label>Mobile Number</label>
        <input
            type="tel"
            id="mobile"
            placeholder="Enter mobile number"
            required
        >

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter email"
            required
        >

        <label>UPI ID</label>
        <input
            type="text"
            id="upiId"
            placeholder="example@upi"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create password"
            required
        >

        <label>Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="links">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

    document.getElementById("registerForm").addEventListener("submit", function(event) {

        event.preventDefault();

        let fullName = document.getElementById("fullName").value;
        let mobile = document.getElementById("mobile").value;
        let email = document.getElementById("email").value;
        let upiId = document.getElementById("upiId").value;
        let password = document.getElementById("password").value;
        let confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {

            document.getElementById("message").innerText =
                "Passwords do not match.";

            return;
        }

        fetch("/api/auth/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                fullName: fullName,
                mobile: mobile,
                email: email,
                upiId: upiId,
                password: password

            })

        })

        .then(response => {

            if (!response.ok) {
                throw new Error("Registration failed");
            }

            return response.json();

        })

        .then(user => {

            document.getElementById("message").innerText =
                "Registration successful! Redirecting to login...";

            setTimeout(function() {

                window.location.href = "login.html";

            }, 1500);

        })

        .catch(error => {

            document.getElementById("message").innerText =
                "Registration failed. Email may already be registered.";

        });

    });

</script>

</body>
</html>
