<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Check Transaction - SecurePay AI</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d6b;
        }

        .back-button {
            background: #555;
        }

        .back-button:hover {
            background: #333;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .safe {
            background: #d1fae5;
            color: #065f46;
        }

        .suspicious {
            background: #fef3c7;
            color: #92400e;
        }

        .fraud {
            background: #fee2e2;
            color: #991b1b;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .result-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

    </style>

</head>


<body>

    <div class="header">

        <h1>SecurePay AI</h1>

        <p>UPI Fraud Detection System</p>

    </div>


    <div class="container">

        <h2>Check Transaction</h2>


        <form id="transactionForm">


            <label for="receiver">
                Receiver
            </label>

            <input
                type="text"
                id="receiver"
                placeholder="Enter receiver"
                required
            >


            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="1"
                required
            >


            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Enter location"
                required
            >


            <label for="newReceiver">
                Is this a new receiver?
            </label>

            <select id="newReceiver">

                <option value="false">
                    No
                </option>

                <option value="true">
                    Yes
                </option>

            </select>


            <label for="deviceChanged">
                Device changed?
            </label>

            <select id="deviceChanged">

                <option value="false">
                    No
                </option>

                <option value="true">
                    Yes
                </option>

            </select>


            <label for="locationChanged">
                Location changed?
            </label>

            <select id="locationChanged">

                <option value="false">
                    No
                </option>

                <option value="true">
                    Yes
                </option>

            </select>


            <label for="transactionsLastHour">
                Transactions in last hour
            </label>

            <input
                type="number"
                id="transactionsLastHour"
                value="1"
                min="0"
            >


            <label for="previousAverageAmount">
                Previous average amount
            </label>

            <input
                type="number"
                id="previousAverageAmount"
                value="0"
                min="0"
            >


            <label for="failedAttempts">
                Failed attempts
            </label>

            <input
                type="number"
                id="failedAttempts"
                value="0"
                min="0"
            >


            <button type="submit">
                Check Transaction
            </button>


        </form>


        <div id="result"></div>


        <button
            class="back-button"
            onclick="goBack()">

            Back to Dashboard

        </button>

    </div>


<script>


/* ==========================================
   CHECK TRANSACTION
   ========================================== */

document
    .getElementById("transactionForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const receiver =
            document.getElementById("receiver").value;

        const amount =
            Number(
                document.getElementById("amount").value
            );

        const location =
            document.getElementById("location").value;


        const newReceiver =
            document.getElementById("newReceiver").value
            === "true";


        const deviceChanged =
            document.getElementById("deviceChanged").value
            === "true";


        const locationChanged =
            document.getElementById("locationChanged").value
            === "true";


        const transactionsLastHour =
            Number(
                document.getElementById(
                    "transactionsLastHour"
                ).value
            );


        const previousAverageAmount =
            Number(
                document.getElementById(
                    "previousAverageAmount"
                ).value
            );


        const failedAttempts =
            Number(
                document.getElementById(
                    "failedAttempts"
                ).value
            );


        /*
         * IMPORTANT:
         * Do NOT check sessionStorage here.
         *
         * Spring Security session cookie
         * will automatically be sent with
         * this request because this is
         * the same localhost application.
         */


        const transactionData = {

            receiver: receiver,

            amount: amount,

            location: location,

            newReceiver: newReceiver,

            deviceChanged: deviceChanged,

            locationChanged: locationChanged,

            transactionsLastHour:
                transactionsLastHour,

            previousAverageAmount:
                previousAverageAmount,

            failedAttempts:
                failedAttempts

        };


        console.log(
            "Sending transaction:",
            transactionData
        );


        fetch("/api/transactions", {

            method: "POST",

            credentials: "same-origin",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(transactionData)

        })

        .then(async response => {

            const text =
                await response.text();


            console.log(
                "Server status:",
                response.status
            );


            console.log(
                "Server response:",
                text
            );


            if (response.status === 401 ||
                response.status === 403) {

                throw new Error(
                    "Your login session has expired. Please login again."
                );

            }


            if (!response.ok) {

                throw new Error(
                    text ||
                    "Transaction could not be processed."
                );

            }


            try {

                return JSON.parse(text);

            } catch {

                return {
                    message: text
                };

            }

        })


        .then(transaction => {

            console.log(
                "Transaction result:",
                transaction
            );


            showResult(transaction);

        })


        .catch(error => {

            console.error(
                "Transaction error:",
                error
            );


            const result =
                document.getElementById("result");


            result.style.display =
                "block";


            result.className =
                "error";


            result.innerHTML =

                "<div class='result-title'>Error</div>" +

                "<p>" +
                error.message +
                "</p>";


        });

    });



/* ==========================================
   SHOW RESULT
   ========================================== */

function showResult(transaction) {

    const result =
        document.getElementById("result");


    result.style.display =
        "block";


    const status =
        transaction.status || "";


    const riskLevel =
        transaction.riskLevel || "";


    let className =
        "safe";


    if (
        status.toUpperCase() === "FRAUD" ||
        riskLevel.toUpperCase() === "HIGH"
    ) {

        className =
            "fraud";

    }

    else if (
        status.toUpperCase() === "SUSPICIOUS" ||
        riskLevel.toUpperCase() === "MEDIUM"
    ) {

        className =
            "suspicious";

    }


    result.className =
        className;


    result.innerHTML = `

        <div class="result-title">
            Transaction Result
        </div>

        <p>
            <strong>Status:</strong>
            ${transaction.status || "Processed"}
        </p>

        <p>
            <strong>Risk Level:</strong>
            ${transaction.riskLevel || "N/A"}
        </p>

        <p>
            <strong>Risk Score:</strong>
            ${transaction.riskScore ?? "N/A"}
        </p>

        <p>
            <strong>Fraud Reason:</strong>
            ${transaction.fraudReason || "No fraud detected"}
        </p>

    `;

}



/* ==========================================
   BACK TO DASHBOARD
   ========================================== */

function goBack() {

    window.location.href =
        "/user-dashboard.html";

}

</script>


</body>

</html>
