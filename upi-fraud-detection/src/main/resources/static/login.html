<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - SecurePay AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin-bottom: 0;
            font-size: 16px;
        }

        .login-container {

            width: 460px;

            max-width: 90%;

            margin: 60px auto;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.1);
        }

        h2 {

            text-align: center;

            color: #1e3a8a;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-top: 15px;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-top: 7px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {

            outline: none;

            border-color: #1e3a8a;
        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 25px;

            background: #1e3a8a;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }

        button:hover {

            background: #162d6b;
        }

        button:disabled {

            background: #7c8db5;

            cursor: not-allowed;
        }

        .links {

            text-align: center;

            margin-top: 20px;
        }

        .links a {

            color: #1e3a8a;

            text-decoration: none;

            font-weight: bold;
        }

        .links a:hover {

            text-decoration: underline;
        }

        #message {

            margin-top: 20px;

            text-align: center;

            font-weight: bold;

            min-height: 20px;
        }

        .error-message {

            color: #dc2626;
        }

        .success-message {

            color: #15803d;
        }

        .admin-link {

            display: block;

            margin-top: 15px;

            text-align: center;
        }

        .admin-link a {

            color: #1e3a8a;

            font-weight: bold;
        }

        .admin-link a:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h1>
            SecurePay AI
        </h1>

        <p>
            UPI Fraud Detection System
        </p>

    </div>


    <!-- LOGIN BOX -->

    <div class="login-container">

        <h2>
            Login
        </h2>


        <form id="loginForm">


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>


        </form>


        <!-- MESSAGE -->

        <div id="message"></div>


        <!-- REGISTER -->

        <div class="links">

            New user?

            <a href="register.html">
                Create Account
            </a>

        </div>


        <!-- ADMIN LOGIN -->

        <div class="admin-link">

            <a
                href="#"
                onclick="showAdminLogin(); return false;"
            >
                Admin Login
            </a>

        </div>


    </div>


    <!-- JAVASCRIPT -->

    <script>


        // =====================================================
        // LOGIN FORM
        // =====================================================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    // Get values
                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    const loginButton =
                        document
                            .getElementById("loginButton");


                    // Clear old message
                    message.innerText = "";

                    message.className = "";


                    // Disable button
                    loginButton.disabled = true;

                    loginButton.innerText =
                        "Logging in...";


                    console.log(
                        "Login button clicked"
                    );

                    console.log(
                        "Email:",
                        email
                    );


                    // =================================================
                    // CALL SPRING BOOT LOGIN API
                    // =================================================

                    fetch(
                        "/api/auth/login",
                        {

                            method: "POST",

                            credentials: "same-origin",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                password: password

                            })

                        }
                    )


                    // =================================================
                    // SERVER RESPONSE
                    // =================================================

                    .then(response => {

                        console.log(
                            "Server response:",
                            response.status
                        );


                        if (!response.ok) {

                            throw new Error(
                                "Invalid email or password."
                            );
                        }


                        return response.json();

                    })


                    // =================================================
                    // LOGIN SUCCESS
                    // =================================================

                    .then(user => {

                        console.log(
                            "LOGIN USER:",
                            user
                        );


                        console.log(
                            "USER ROLE:",
                            user.role
                        );


                        console.log(
                            "USER NAME:",
                            user.fullName
                        );


                        // =================================================
                        // IMPORTANT:
                        // STORE USER INFORMATION
                        // =================================================

                        sessionStorage.setItem(
                            "userRole",
                            user.role
                        );


                        sessionStorage.setItem(
                            "userEmail",
                            user.email
                        );


                        /*
                         * THIS WAS THE MISSING PART.
                         *
                         * Transaction page needs userName.
                         */

                        sessionStorage.setItem(
                            "userName",
                            user.fullName ||
                            user.email
                        );


                        console.log(
                            "SESSION USER NAME:",
                            sessionStorage.getItem(
                                "userName"
                            )
                        );


                        // =================================================
                        // REDIRECT ACCORDING TO ROLE
                        // =================================================

                        if (
                            user.role === "ADMIN"
                        ) {

                            console.log(
                                "Admin detected."
                            );


                            window.location.href =
                                "admin-dashboard.html";

                        }

                        else {

                            console.log(
                                "User detected."
                            );


                            window.location.href =
                                "user-dashboard.html";
                        }

                    })


                    // =================================================
                    // LOGIN ERROR
                    // =================================================

                    .catch(error => {

                        console.error(
                            "LOGIN ERROR:",
                            error
                        );


                        message.innerText =
                            "Invalid email or password.";

                        message.className =
                            "error-message";


                        // Enable button again
                        loginButton.disabled =
                            false;

                        loginButton.innerText =
                            "Login";

                    });

                }
            );


        // =====================================================
        // ADMIN LOGIN INFORMATION
        // =====================================================

        function showAdminLogin() {

            const message =
                document.getElementById(
                    "message"
                );


            message.innerText =
                "Admin login uses the same login form. Enter an administrator account.";

            message.className =
                "success-message";
        }


    </script>


</body>

</html>
